name: CI

# Phase 0 gate — refactor.md §5 PR 5.
#
# Three hard gates, all of which must stay green:
#
#   1. npm test               — test/run_tests.sh: 51 passing, 4 quarantined, exit 0.
#                               Quarantined files are listed in test/QUARANTINE.md and
#                               reported as SKIP. That list is capped at five files and
#                               every entry names an owner PR; do not grow it to make
#                               this job green.
#   2. npm run check-globals   — scripts/check-globals.js: 0 duplicate top-level
#                               symbols across the 65 classic <script> tags in
#                               index.html. This is the check that found the eight
#                               silent global collisions fixed in PR 3. It exists so
#                               they cannot come back during the PR 9 migration.
#   3. npm run build           — added by PR 7 with the script itself, as promised
#                               below. Today it only proves `vite build` does not
#                               crash: index.html's 65 script tags are classic, not
#                               modules, so Vite emits a warning per tag and does not
#                               bundle them, and dist/ is NOT runnable (D-24, owned by
#                               PR 9). It earns its keep during PR 9, when each
#                               converted file becomes something the build can
#                               actually fail on.
#
# Deliberately NOT here yet — the script does not exist:
#
#   npm run lint    → added by PR 11 (ESLint 9 flat config + Prettier)
#
# refactor.md §5 PR 5 lists it in the step chain, but `npm run <missing-script>`
# exits 1, so adding it now would make CI red on its first run, and adding it
# with `|| true` would be a gate that reports success without checking anything.
# PR 11 adds its step in the same commit that adds the script — the idiom PR 7
# followed for `build`.
#
# Deliberately NOT here for a different reason — the script DOES exist:
#
#   npm run test:e2e  → the DEPLOY.md §7 save/load harness (PR 6b,
#                       test/e2e/saveLoad.js). Runs a real browser via
#                       playwright-core's channel:msedge. ubuntu-latest has no
#                       Edge, and installing a Chromium plus software-rasterising
#                       WebGL through SwiftShader turns a ~26 s job into minutes.
#                       It is a local pre-Phase-gate gate, not a per-push one.
#                       (It used to also assert known defects; none remain — H-1,
#                       D-15 and D-14 were all fixed and their blocks rewritten
#                       into the assertions the fixes make true.)
#
#   npm run test:e2e:vite → the same 150 assertions against `npm run dev` instead
#                       of test/e2e/staticServer.js, added by PR 7. Same browser
#                       requirement, same owner.
#
#                       PR 10 is the earliest sensible owner if this ever moves to
#                       CI: it already rewrites the deploy path and would want a
#                       post-deploy smoke check. Doing it needs a
#                       `browser-actions/setup-chrome` (or playwright's own
#                       docker image) plus the SwiftShader flags already in
#                       test/e2e/saveLoad.js, on a separate job so it cannot slow
#                       the two gates below.
#
# test/run_tests.sh globs test/test_*.js — flat, non-recursive — so nothing under
# test/e2e/ reaches `npm test` either. That is deliberate; keep it that way.

on:
  push:
  pull_request:

# A newer push to the same ref supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + check-globals + build
    runs-on: ubuntu-latest

    # The suite runs in ~20s but stands up real WebSocket servers on fixed ports and
    # has no per-test timeout of its own. 10 minutes fails fast instead of burning the
    # 6-hour default if a test hangs — PR 4 fixed a test that did exactly that
    # (test_websocketErrorHandling: passing fell off the end with timers still pending).
    timeout-minutes: 10

    steps:
      # Both actions are pinned to the current latest major. @v4 targets the
      # deprecated Node 20 action runtime and the runner forces it onto Node 24
      # with a warning annotation on every run; that shim goes away eventually.
      # v5+ requires runner >= v2.327.1 — fine on GitHub-hosted, worth knowing if
      # this ever runs on a self-hosted runner.
      #
      # Full checkout. Do NOT sparse-checkout textures/ to save the 118 MB:
      # test_manifestGenerator runs scripts/generate-manifest.js, which
      # readdirSync()s textures/blocks/ and cross-checks it against the block
      # registry. That is the test that found the duplicate block id in PR 4.
      - uses: actions/checkout@v7

      # setup-node v5 added automatic caching driven by a `packageManager` field
      # in package.json, and v6 narrowed it to npm. package.json has no such
      # field and `cache: npm` below is the explicit form, so none of that
      # applies here either way.
      - uses: actions/setup-node@v7
        with:
          # Resolves to the latest 22.x. jsdom@30 requires >=22.22.2, so do not pin
          # this to an exact older 22.x patch without checking that floor.
          node-version: '22'
          cache: npm

      - run: npm ci

      # test/run_tests.sh is bash, not sh: it uses `local`, `echo -e`, and GNU
      # `grep -E` / `sed -E` to parse the first column of the table in
      # test/QUARANTINE.md. `shell: bash` is already the ubuntu-latest default —
      # it is stated explicitly so the requirement survives a runner change.
      - name: Test suite
        shell: bash
        run: npm test

      - name: No duplicate top-level globals
        shell: bash
        run: npm run check-globals

      # Added by PR 7 in the same commit as the script, per the note above.
      # `vite build` currently emits one "can't be bundled without type=module"
      # warning per classic <script src> in index.html and exits 0; dist/ is not
      # runnable and is not deployed (D-24, D-4). What this catches today is a
      # config or HTML change that breaks the build outright, and from PR 9 onward
      # it catches a module that does not resolve.
      - name: Build
        shell: bash
        run: npm run build
