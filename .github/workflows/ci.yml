name: CI

# Phase 0 gate — refactor.md §5 PR 5.
#
# Three hard gates, all of which must stay green:
#
#   1. npm test               — test/run_tests.sh: 52 passing, 4 quarantined, exit 0.
#                               Quarantined files are listed in test/QUARANTINE.md and
#                               reported as SKIP. That list is capped at five files and
#                               every entry names an owner PR; do not grow it to make
#                               this job green.
#                               PR 9 note: the runner invokes node with
#                               `-r ./test/helpers/esmRequire.js`. Without that hook
#                               every test that requires a source file dies on "Cannot
#                               use import statement outside a module". PR 31 removes
#                               both when Vitest arrives.
#   2. npm run lint            — ESLint 9 flat config, `no-undef: error`. This REPLACED
#                               scripts/check-globals.js in PR 11, which deleted the
#                               script and its step in the same commit. That script had
#                               counted duplicate top-level symbols across index.html's
#                               65 classic <script> tags (the check that found the eight
#                               silent collisions PR 3 fixed), and PR 9 repointed it at
#                               the module boundary once there was no shared global scope
#                               left to find duplicates in. `no-undef` is strictly
#                               stronger and it caught two real bugs on its first run:
#                               D-32 (`sumBase`/`sumAmp` assigned without declaration —
#                               a ReferenceError under module strict mode) and D-31
#                               (`inventoryOpen` referenced from a scope it was never in,
#                               so Escape never closed the inventory).
#                               Warnings do not fail; errors do. Do NOT disable no-undef
#                               to make this green — in an ES module an unresolved name
#                               is a bug, not a style opinion.
#                               `prettier` ships as `npm run format` and is deliberately
#                               NOT a CI step: nothing has been reformatted, and doing it
#                               would touch every file in the repo right before Phase 2
#                               moves all of it.
#   3. npm run build           — added by PR 7 with the script itself, as promised
#                               below. Since PR 9 it is a real gate: index.html loads
#                               one ES module, so an unresolvable import, a duplicate
#                               binding or a syntax error anywhere in src/ fails it.
#                               It also produces the artifact PR 10 deploys and that
#                               `npm run test:e2e` now runs against — D-24 closed.
#
# Deliberately NOT here — the script exists but the check is not one this job should make:
#
#   npm run test:e2e  → the DEPLOY.md §7 save/load harness (PR 6b,
#                       test/e2e/saveLoad.js). Runs a real browser via
#                       playwright-core's channel:msedge. ubuntu-latest has no
#                       Edge, and installing a Chromium plus software-rasterising
#                       WebGL through SwiftShader turns a ~26 s job into minutes.
#                       It is a local pre-Phase-gate gate, not a per-push one.
#                       (It used to also assert known defects; none remain — H-1,
#                       D-15 and D-14 were all fixed and their blocks rewritten
#                       into the assertions the fixes make true.)
#
#   npm run format:check → prettier. Not a gate: nothing in this repo has been
#                       reformatted yet, and running it across 34,000 lines would touch
#                       every file right before Phase 2 starts moving all of them.
#                       Format what you touch. PR 26/27 (HTML/CSS) is the natural point
#                       to reconsider.
#
#   npm run test:e2e:vite → the same 152 assertions against `npm run dev` instead
#                       of test/e2e/staticServer.js, added by PR 7. Same browser
#                       requirement, same owner.
#
#                       PR 10 is the earliest sensible owner if this ever moves to
#                       CI: it already rewrites the deploy path and would want a
#                       post-deploy smoke check. Doing it needs a
#                       `browser-actions/setup-chrome` (or playwright's own
#                       docker image) plus the SwiftShader flags already in
#                       test/e2e/saveLoad.js, on a separate job so it cannot slow
#                       the three gates below.
#
# test/run_tests.sh globs test/test_*.js — flat, non-recursive — so nothing under
# test/e2e/ reaches `npm test` either. That is deliberate; keep it that way.

# D-22, closed by PR 11. `on: push` with no branch filter PLUS `on: pull_request` meant a
# same-repo PR branch ran CI **twice** on every push — observed, not predicted, once PR #1
# opened. PR 7 and PR 9 both edited this file and deliberately left it alone: narrowing it
# while `refactor/phase-0` was the only branch being worked on would have removed the
# push-triggered feedback loop the whole plan depends on, and it was PR 11's call to make.
#
# It is PR 11 now, `main` is about to start moving, and the loop is not lost — every push
# to a branch with an open PR still triggers `pull_request`. What stops is the duplicate.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + lint + build
    runs-on: ubuntu-latest

    # The suite runs in ~20s but stands up real WebSocket servers on fixed ports and
    # has no per-test timeout of its own. 10 minutes fails fast instead of burning the
    # 6-hour default if a test hangs — PR 4 fixed a test that did exactly that
    # (test_websocketErrorHandling: passing fell off the end with timers still pending).
    timeout-minutes: 10

    steps:
      # Both actions are pinned to the current latest major. @v4 targets the
      # deprecated Node 20 action runtime and the runner forces it onto Node 24
      # with a warning annotation on every run; that shim goes away eventually.
      # v5+ requires runner >= v2.327.1 — fine on GitHub-hosted, worth knowing if
      # this ever runs on a self-hosted runner.
      #
      # Full checkout. Do NOT sparse-checkout textures/ to save the 118 MB:
      # test_manifestGenerator runs scripts/generate-manifest.js, which
      # readdirSync()s textures/blocks/ and cross-checks it against the block
      # registry. That is the test that found the duplicate block id in PR 4.
      - uses: actions/checkout@v7

      # setup-node v5 added automatic caching driven by a `packageManager` field
      # in package.json, and v6 narrowed it to npm. package.json has no such
      # field and `cache: npm` below is the explicit form, so none of that
      # applies here either way.
      - uses: actions/setup-node@v7
        with:
          # Resolves to the latest 22.x. jsdom@30 requires >=22.22.2, so do not pin
          # this to an exact older 22.x patch without checking that floor.
          node-version: '22'
          cache: npm

      - run: npm ci

      # test/run_tests.sh is bash, not sh: it uses `local`, `echo -e`, and GNU
      # `grep -E` / `sed -E` to parse the first column of the table in
      # test/QUARANTINE.md. `shell: bash` is already the ubuntu-latest default —
      # it is stated explicitly so the requirement survives a runner change.
      - name: Test suite
        shell: bash
        run: npm test

      # Replaced scripts/check-globals.js, which PR 11 deleted in this same commit.
      # `no-undef` is the strictly stronger check and it caught two real bugs on its first
      # run (D-31, D-32). Warnings do not fail the build; errors do. Do not disable
      # no-undef to make this green — an unresolved name in an ES module is a bug.
      - name: Lint
        shell: bash
        run: npm run lint

      # Added by PR 7 in the same commit as the script, per the note above. Since PR 9
      # this compiles the whole module graph — an unresolvable import, a duplicate
      # binding or a syntax error anywhere in src/ fails here — and it produces the
      # dist/ that PR 10 deploys and that `npm run test:e2e` runs against.
      - name: Build
        shell: bash
        run: npm run build
