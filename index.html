<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cuubz — Voxel Survival</title>
  <link rel="stylesheet" href="/src/ui/css/index.css">
</head>
<body>
  <!-- ── The UI ────────────────────────────────────────────────────────────────
       525 lines stood here: 23 top-level elements, 157 unique ids, seven screens,
       three modals and two overlays. They are `src/ui/templates/*.js` now — one
       module per screen or overlay — and `mountTemplates()` fills this div from the
       first statement of `Bootstrap.start()`, in the old DOM order, before anything
       in `src/` looks an element up. `refactor.md` §10; the argument for mounting
       eagerly rather than on show is decision 53, in `src/ui/templates/index.js`. -->
  <div id="app"></div>

  <!-- ── Application ───────────────────────────────────────────────────────────
       ONE module. Before PR 9 this was 65 classic <script src> tags whose only
       contract was global-scope load order — the mechanism behind the eight silent
       collisions in refactor.md §2 and behind D-23, the 65 hand-maintained ?v=
       cache-bust strings that nothing checked. Vite resolves the imports and emits a
       content-hashed bundle, so neither the ordering nor the cache-bust convention
       exists any more. src/index.js is the whole entry point. -->
  <script type="module" src="/src/index.js"></script>
</body>
</html>
